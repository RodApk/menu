<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<title>COMEDOR LAS DOS MARÍAS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Montserrat', sans-serif;
background:#0f0f0f;
color:#eaeaea;
}

.container{
max-width:900px;
margin:60px auto;
background:#1a1a1a;
border-radius:18px;
box-shadow:0 25px 60px rgba(0,0,0,0.7);
overflow:hidden;
border:1px solid #2a2a2a;
}

header{
display:flex;
align-items:center;
gap:20px;
padding:45px;
background:linear-gradient(135deg,#242424,#303030);
border-bottom:1px solid #3a3a3a;
}

/* ANIMACIÓN DEL LOGO */

header img{
width:110px;
animation:logoGlow 3s infinite ease-in-out;
}

@keyframes logoGlow{

0%{
transform:scale(1);
filter:drop-shadow(0 0 4px rgba(212,175,55,0.3));
}

50%{
transform:scale(1.05);
filter:drop-shadow(0 0 18px rgba(212,175,55,0.8));
}

100%{
transform:scale(1);
filter:drop-shadow(0 0 4px rgba(212,175,55,0.3));
}

}

.header-text{
flex:1;
text-align:center;
}

header h1{
font-family:'Playfair Display', serif;
margin:0;
font-size:0.95em;
letter-spacing:6px;
color:#d4af37;
}

.nombre{
font-family:'Playfair Display', serif;
font-size:2.8em;
font-weight:700;
letter-spacing:6px;
margin-top:10px;
color:#f1d27a;
}

header p{
margin-top:12px;
font-size:0.85em;
color:#bbb;
}

.horario{
text-align:center;
padding:18px;
background:#181818;
letter-spacing:2px;
border-bottom:1px solid #2c2c2c;
color:#d4af37;
}

.section{
padding:45px;
}

.section h2{
text-align:center;
font-family:'Playfair Display', serif;
font-size:1.9em;
margin-bottom:20px;
letter-spacing:4px;
color:#f1d27a;
}

.subtitulo{
margin-top:40px;
margin-bottom:15px;
letter-spacing:3px;
font-size:1em;
color:#d4af37;
border-bottom:1px solid #333;
padding-bottom:8px;
}

.menu-item{
display:flex;
justify-content:space-between;
padding:18px 0;
border-bottom:1px solid #2a2a2a;
font-size:1.05em;
}

.menu-item small{
display:block;
font-size:0.85em;
color:#aaa;
margin-top:5px;
}

.menu-item span:last-child{
font-weight:600;
color:#f1d27a;
}

.promo{
color:#ffd966;
font-size:0.8em;
margin-top:6px;
}

.domicilio{
margin-top:40px;
padding:20px;
text-align:center;
background:#181818;
border-radius:12px;
border:1px solid #2c2c2c;
color:#d4af37;
}

.whatsapp{
margin-top:25px;
padding:20px;
text-align:center;
background:#151515;
border-radius:12px;
border:1px solid #2c2c2c;
}

.whatsapp-float{
position:fixed;
width:65px;
height:65px;
bottom:25px;
right:25px;
background:#25d366;
border-radius:50%;
text-align:center;
box-shadow:0 8px 25px rgba(0,0,0,0.5);
animation:pulse 2s infinite;
z-index:100;
}

.whatsapp-float img{
width:38px;
margin-top:13px;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(37,211,102,0.6);}
70%{box-shadow:0 0 0 18px rgba(37,211,102,0);}
100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}
}

footer{
text-align:center;
padding:35px;
font-size:0.8em;
background:#141414;
color:#777;
letter-spacing:2px;
}

</style>
</head>

<body>

<div class="container">

<header>
<img src="logo-las-dos-marias.png" alt="Logo Comedor Las Dos Marías">

<div class="header-text">
<h1>COMEDOR</h1>
<div class="nombre">LAS DOS MARÍAS</div>
<p id="fecha"></p>
</div>

</header>

<div class="horario">
HORARIO DE SERVICIO: 10:00 AM – 10:00 PM
</div>

<!-- resto del menú queda igual -->

<script>
const opciones = { weekday:'long', year:'numeric', month:'long', day:'numeric'};
const hoy = new Date().toLocaleDateString('es-MX',opciones);
document.getElementById('fecha').textContent =
hoy.charAt(0).toUpperCase()+hoy.slice(1);
</script>

</body>
</html>
