<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>COMEDOR LAS DOS MARÍAS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: "Georgia", "Times New Roman", serif;
            background-color: #f2f2f2;
            color: #333;
        }

        .container {
            max-width: 750px;
            margin: 25px auto;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 22px rgba(0,0,0,0.18);
            overflow: hidden;
        }

        /* HEADER */
        header {
            display: flex;
            align-items: center;
            gap: 20px;
            background: linear-gradient(135deg, #fff7e6, #e9d3a3);
            color: #4a2e00;
            padding: 25px 30px;
        }

        header img {
            max-width: 110px;
        }

        .header-text {
            flex: 1;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.3em;
            letter-spacing: 2px;
        }

        header .nombre {
            margin-top: 6px;
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 3px;
        }

        header p {
            margin-top: 8px;
            font-size: 0.95em;
            opacity: 0.9;
        }

        /* HORARIO */
        .horario {
            text-align: center;
            padding: 12px;
            background: #f8f1e1;
            border-bottom: 1px solid #e0d3b8;
            font-weight: bold;
            color: #5a0000;
            letter-spacing: 1px;
        }

        /* SECCIONES */
        .section {
            padding: 30px;
        }

        .section h2 {
            text-align: center;
            font-size: 1.4em;
            margin-bottom: 20px;
            border-bottom: 2px solid #cfcfcf;
            padding-bottom: 8px;
            letter-spacing: 2px;
        }

        .subtitulo {
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: bold;
            letter-spacing: 1px;
            color: #6b3f00;
            border-left: 5px solid #e9d3a3;
            padding-left: 10px;
        }

        /* MENÚ */
        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dotted #bbb;
            font-size: 1.05em;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        /* SERVICIOS */
        .domicilio {
            margin-top: 25px;
            padding: 15px;
            background: #f8f1e1;
            border-left: 5px solid #8b0000;
            text-align: center;
            font-size: 1.05em;
            font-weight: bold;
            color: #5a0000;
        }

        .whatsapp {
            margin-top: 20px;
            padding: 18px;
            background: #e9f7ef;
            border-left: 5px solid #25d366;
            text-align: center;
            font-size: 1em;
        }

        .whatsapp a {
            display: inline-block;
            margin: 6px 10px;
            text-decoration: none;
            color: #075e54;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
            background: #fafafa;
            color: #777;
        }
    </style>
</head>
<body>

        </div>
    </header>
