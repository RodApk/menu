<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>COMEDOR LAS DOS MARÍAS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:'Montserrat',sans-serif;background:#1a1a1a;color:#eaeaea;}
.container{max-width:900px;margin:50px auto;background:#222;border-radius:18px;overflow:hidden;}
header{display:flex;align-items:center;gap:20px;padding:35px;background:#444;}
header img{width:110px;cursor:pointer;}
.nombre{font-family:'Playfair Display';font-size:2.4em;color:#ffd76a;}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #333;}
.item-left{display:flex;align-items:center;gap:10px;}
.product-img{width:45px;height:45px;border-radius:50%;cursor:pointer;border:2px solid #ffd76a;}
.btn{margin-left:5px;border:none;padding:6px;border-radius:6px;cursor:pointer;}
.pedir{background:#25D366;color:white;}
.add{background:#ffd76a;color:black;}

.modal{display:none;position:fixed;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;}
.modal img{max-width:90%;}

.reel{display:none;position:fixed;width:100%;height:100%;background:black;justify-content:center;align-items:center;flex-direction:column;}

.carrito{position:fixed;bottom:10px;left:10px;background:#222;padding:10px;border-radius:10px;}
</style>
</head>

<body>

<div class="container">

<header>
<img src="logo-las-dos-marias.png" onclick="verImagen('MenuGeneral.jpg')">
<div class="nombre">LAS DOS MARÍAS</div>
</header>

<!-- PRODUCTOS COMPLETOS (NO ELIMINADOS) -->

<div class="menu-item">
<div class="item-left">
<img class="product-img" src="Picadillo.jpeg" onclick="verImagen('Picadillo.jpeg')">
<div>Picadillo de res a la mexicana</div>

<button class="btn pedir" onclick="event.stopPropagation(); pedir('Picadillo de res')">PEDIR</button>
<button class="btn add" onclick="event.stopPropagation(); agregar('Picadillo',90)">+</button>

</div>
<span>$90</span>
</div>

<div class="menu-item">
<div class="item-left">
<img class="product-img" src="FajitasRes.jpg" onclick="verImagen('FajitasRes.jpg')">
<div>Fajitas de res</div>

<button class="btn pedir" onclick="event.stopPropagation(); pedir('Fajitas')">PEDIR</button>
<button class="btn add" onclick="event.stopPropagation(); agregar('Fajitas',90)">+</button>

</div>
<span>$90</span>
</div>

<div class="menu-item">
<div class="item-left">
<img class="product-img" src="HotDogs.jpeg" onclick="abrirReel('hotdogs')">
<div>Hot Dogs gratinados</div>

<button class="btn pedir" onclick="event.stopPropagation(); pedir('Hot Dogs')">PEDIR</button>
<button class="btn add" onclick="event.stopPropagation(); agregar('Hot Dogs',45)">+</button>

</div>
<span>$45</span>
</div>

<div class="menu-item">
<div class="item-left">
<img class="product-img" src="Sincronizada.jpg" onclick="abrirReel('sincronizadas')">
<div>Sincronizadas</div>

<button class="btn pedir" onclick="event.stopPropagation(); pedir('Sincronizadas')">PEDIR</button>
<button class="btn add" onclick="event.stopPropagation(); agregar('Sincronizadas',45)">+</button>

</div>
<span>$45</span>
</div>

<div class="menu-item">
<div class="item-left">
<img class="product-img" src="TlayudaEspecial.jpg" onclick="verImagen('TlayudaEspecial.jpg')">
<div>Tlayuda especial</div>

<button class="btn pedir" onclick="event.stopPropagation(); pedir('Tlayuda especial')">PEDIR</button>
<button class="btn add" onclick="event.stopPropagation(); agregar('Tlayuda especial',90)">+</button>

</div>
<span>$90</span>
</div>

<div class="menu-item">
<div class="item-left">
<img class="product-img" src="AguaJamaica.jpg" onclick="verImagen('AguaJamaica.jpg')">
<div>Agua (horchata/jamaica/tamarindo)</div>

<button class="btn pedir" onclick="event.stopPropagation(); pedir('Agua')">PEDIR</button>
<button class="btn add" onclick="event.stopPropagation(); agregar('Agua',15)">+</button>

</div>
<span>$15</span>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="cerrarModal(event)">
<img id="imgModal">
</div>

<!-- REEL -->
<div id="reel" class="reel" onclick="cerrarReel()">
<img id="reelImg">
</div>

<!-- CARRITO -->
<div class="carrito">
<div id="lista"></div>
<div>Total: $<span id="total">0</span></div>
<button onclick="enviar()">Enviar pedido</button>
</div>

<script>

let carrito=[];
let total=0;

function verImagen(src){
document.getElementById("modal").style.display="flex";
document.getElementById("imgModal").src=src;
}

function cerrarModal(e){
if(e.target.id==="modal"){
document.getElementById("modal").style.display="none";
}
}

function abrirReel(tipo){
document.getElementById("reel").style.display="flex";
document.getElementById("reelImg").src="HotDogs.jpeg";
}

function cerrarReel(){
document.getElementById("reel").style.display="none";
}

function pedir(nombre){
window.open("https://wa.me/5219531543729?text="+encodeURIComponent("Quiero pedir "+nombre));
}

function agregar(nombre,precio){
let item=carrito.find(x=>x.nombre===nombre);
if(item){item.cantidad++;}else{carrito.push({nombre,precio,cantidad:1});}
actualizar();
}

function actualizar(){
let lista="";
total=0;
carrito.forEach(i=>{
total+=i.precio*i.cantidad;
lista+=i.nombre+" x"+i.cantidad+"<br>";
});
document.getElementById("lista").innerHTML=lista;
document.getElementById("total").innerText=total;
}

function enviar(){
let msg="Pedido:%0A";
carrito.forEach(i=>{
msg+=i.nombre+" x"+i.cantidad+"%0A";
});
msg+="Total: $"+total;
window.open("https://wa.me/5219531543729?text="+msg);
}

</script>

</body>
</html>
